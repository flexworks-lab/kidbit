<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kidbit Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#080808;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.top{height:70px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 28px;position:sticky;top:0;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);z-index:5}.back{border:0;background:#191919;color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.logo{font-size:25px;font-weight:800;margin:auto}.logo span{color:#7c5cff}.profile{max-width:900px;margin:45px auto;padding:0 25px}.head{display:flex;align-items:center;gap:25px}.avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#00d4ff);font-size:42px;font-weight:800;flex-shrink:0}.name{font-size:29px;font-weight:800}.handle{color:#999;margin-top:5px}.bio{margin-top:13px;color:#ddd;line-height:1.5}.stats{display:flex;gap:30px;margin-top:18px}.stats b{font-size:19px}.stats span{color:#999;font-size:13px}.follow{margin-left:auto;border:0;background:#7c5cff;color:#fff;font-weight:bold;padding:11px 22px;border-radius:10px;cursor:pointer}.follow.active{background:#222;color:#aaa}.edit{border:1px solid #444;background:#151515;color:#fff;font-weight:bold;padding:11px 18px;border-radius:10px;cursor:pointer}.profileActions{margin-left:auto;display:flex;gap:8px}.tabs{display:flex;gap:35px;margin-top:55px;border-bottom:1px solid #292929}.tabs button{border:0;background:transparent;color:#888;padding:15px 5px;cursor:pointer}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:15px}.tile{aspect-ratio:9/14;background:#151515;overflow:hidden;cursor:pointer}.tile video{width:100%;height:100%;object-fit:cover}.empty{grid-column:1/-1;text-align:center;color:#777;padding:70px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:20}.modal.open{display:grid}.box{width:min(420px,90vw);background:#151515;border:1px solid #333;border-radius:18px;padding:22px}.box h2{margin-bottom:18px}.box input,.box textarea{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:12px;font:inherit}.box textarea{height:100px;resize:vertical}.boxBtns{display:flex;gap:8px;justify-content:flex-end}.boxBtns button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer}.cancel{background:#292929;color:#fff}.save{background:#7c5cff;color:#fff;font-weight:bold}@media(max-width:600px){.profile{margin-top:30px;padding:0 14px}.head{gap:15px;align-items:flex-start}.avatar{width:78px;height:78px;font-size:30px}.name{font-size:22px}.profileActions{margin-left:0;margin-top:8px}.follow{padding:9px 14px}.edit{padding:9px 12px}.grid{grid-template-columns:repeat(2,1fr)}.stats{gap:18px}}
</style></head>
<body>
<header class="top"><button class="back" onclick="location.href='index.html'">← Back</button><div class="logo">kid<span>bit</span></div><div style="width:67px"></div></header>
<main class="profile"><section class="head"><div class="avatar" id="avatar">K</div><div style="flex:1"><div class="name" id="name">@kidbit</div><div class="handle" id="handle">@kidbit on Kidbit</div><div class="bio" id="bio">Making cool stuff 🎮</div><div class="stats"><div><b id="followers">0</b><br><span>Followers</span></div><div><b id="following">0</b><br><span>Following</span></div><div><b id="likes">0</b><br><span>Likes</span></div></div><div class="profileActions"><button class="follow" id="follow">Follow</button><button class="edit" id="edit">Edit Profile</button></div></div></section><nav class="tabs"><button class="active">Videos</button><button id="likedTab">Liked</button></nav><section class="grid" id="grid"></section></main>
<div class="modal" id="modal"><div class="box"><h2>Edit profile</h2><input id="bioInput" maxlength="120" placeholder="Your bio"><div class="boxBtns"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save</button></div></div></div>
<script>
const params=new URLSearchParams(location.search);let username=params.get('user')||'@alex';if(!username.startsWith('@'))username='@'+username;
const profiles={ '@alex':{avatar:'A',bio:'Game dev + creator 🎮',followers:128,following:42,likes:12400}, '@jay':{avatar:'J',bio:'Animation is awesome ✨',followers:894,following:31,likes:8100}, '@milo':{avatar:'M',bio:'Just making stuff! 🚀',followers:642,following:28,likes:5700} };
const p=profiles[username]||{avatar:username.replace('@','')[0]?.toUpperCase()||'K',bio:'Making cool stuff 🎮',followers:0,following:0,likes:0};
const localBio=localStorage.getItem('kidbitBio');if(username==='@alex'&&localBio)p.bio=localBio;
document.getElementById('name').textContent=username;document.getElementById('handle').textContent=username+' on Kidbit';document.getElementById('avatar').textContent=p.avatar;document.getElementById('bio').textContent=p.bio;document.getElementById('followers').textContent=format(p.followers);document.getElementById('following').textContent=format(p.following);document.getElementById('likes').textContent=format(p.likes);
const followed=new Set(JSON.parse(localStorage.getItem('kidbitFollowed')||'[]'));const follow=document.getElementById('follow');function updateFollow(){const on=followed.has(username);follow.textContent=on?'Following':'Follow';follow.classList.toggle('active',on)}updateFollow();follow.onclick=()=>{if(followed.has(username))followed.delete(username);else followed.add(username);localStorage.setItem('kidbitFollowed',JSON.stringify([...followed]));updateFollow()};
function format(n){if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return(n/1000).toFixed(1).replace('.0','')+'K';return String(n)}
const defaults={'@alex':['videos/video1.mp4'],'@jay':['videos/video2.mp4'],'@milo':['videos/video3.mp4']};const grid=document.getElementById('grid');
function addVideo(src){const tile=document.createElement('div');tile.className='tile';tile.innerHTML='<video src="'+src+'" muted loop playsinline preload="metadata"></video>';const v=tile.querySelector('video');tile.onmouseenter=()=>v.play().catch(()=>{});tile.onmouseleave=()=>v.pause();tile.onclick=()=>location.href='index.html';grid.appendChild(tile)}
(defaults[username]||[]).forEach(addVideo);
if('indexedDB' in window){const req=indexedDB.open('KidbitDB',1);req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains('posts'))return;const all=db.transaction('posts','readonly').objectStore('posts').getAll();all.onsuccess=()=>{all.result.reverse().filter(x=>x.username===username).forEach(x=>{if(x.videoBlob){const url=URL.createObjectURL(x.videoBlob);addVideo(url)}});if(!grid.children.length)grid.innerHTML='<div class="empty">No videos yet.</div>'}}}
else if(!grid.children.length)grid.innerHTML='<div class="empty">No videos yet.</div>';
document.getElementById('edit').onclick=()=>{if(username!=='@alex'){alert('You can edit your own profile when accounts are added.');return}document.getElementById('bioInput').value=document.getElementById('bio').textContent;document.getElementById('modal').classList.add('open')};document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('save').onclick=()=>{const bio=document.getElementById('bioInput').value.trim()||'Making cool stuff 🎮';localStorage.setItem('kidbitBio',bio);document.getElementById('bio').textContent=bio;document.getElementById('modal').classList.remove('open')};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
</script></body></html>

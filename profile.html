<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kidbit Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#080808;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.top{height:70px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 28px;position:sticky;top:0;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);z-index:5}.back{border:0;background:#191919;color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.logo{font-size:25px;font-weight:800;margin:auto}.logo span{color:#7c5cff}.profile{max-width:850px;margin:55px auto;padding:0 25px}.head{display:flex;align-items:center;gap:28px}.avatar{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#00d4ff);font-size:40px;font-weight:800}.name{font-size:29px;font-weight:800}.handle{color:#999;margin-top:5px}.bio{margin-top:13px;color:#ddd}.stats{display:flex;gap:30px;margin-top:18px}.stats b{font-size:19px}.stats span{color:#999;font-size:13px}.tabs{display:flex;gap:35px;margin-top:55px;border-bottom:1px solid #292929}.tabs button{border:0;background:transparent;color:#888;padding:15px 5px;cursor:pointer}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:15px}.tile{aspect-ratio:9/14;background:#151515;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.empty{grid-column:1/-1;text-align:center;color:#777;padding:70px}.follow{margin-left:auto;border:0;background:#7c5cff;color:#fff;font-weight:bold;padding:11px 22px;border-radius:10px;cursor:pointer}.follow.active{background:#222;color:#aaa}@media(max-width:600px){.profile{margin-top:30px}.head{gap:16px}.avatar{width:80px;height:80px;font-size:30px}.name{font-size:22px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="location.href='index.html'">← Back</button><div class="logo">kid<span>bit</span></div><div style="width:67px"></div></header>
<main class="profile">
<section class="head"><div class="avatar" id="avatar">K</div><div><div class="name" id="name">@kidbit</div><div class="handle" id="handle">Kidbit creator</div><div class="bio" id="bio">Making cool stuff 🎮</div><div class="stats"><div><b id="followers">0</b><br><span>Followers</span></div><div><b id="following">0</b><br><span>Following</span></div><div><b id="likes">0</b><br><span>Likes</span></div></div></div><button class="follow" id="follow">Follow</button></section>
<nav class="tabs"><button class="active">Videos</button><button>Liked</button></nav><section class="grid" id="grid"></section>
</main>
<script>
const params=new URLSearchParams(location.search);const username=params.get('user')||'@kidbit';
const profiles={
'@alex':{avatar:'A',bio:'Game dev + creator 🎮',followers:'1.2K',following:'42',likes:'12.4K'},
'@jay':{avatar:'J',bio:'Animation is awesome ✨',followers:'894',following:'31',likes:'8.1K'},
'@milo':{avatar:'M',bio:'Just making stuff!',followers:'642',following:'28',likes:'5.7K'}
};
const p=profiles[username]||{avatar:username.replace('@','')[0]?.toUpperCase()||'K',bio:'Making cool stuff 🎮',followers:'0',following:'0',likes:'0'};
document.getElementById('name').textContent=username;document.getElementById('handle').textContent=username+' on Kidbit';document.getElementById('avatar').textContent=p.avatar;document.getElementById('bio').textContent=p.bio;document.getElementById('followers').textContent=p.followers;document.getElementById('following').textContent=p.following;document.getElementById('likes').textContent=p.likes;
const followed=new Set(JSON.parse(localStorage.getItem('kidbitFollowed')||'[]'));const follow=document.getElementById('follow');function updateFollow(){const on=followed.has(username);follow.textContent=on?'Following':'Follow';follow.classList.toggle('active',on)}updateFollow();follow.onclick=()=>{if(followed.has(username))followed.delete(username);else followed.add(username);localStorage.setItem('kidbitFollowed',JSON.stringify([...followed]));updateFollow()};
const defaults={"@alex":'videos/video1.mp4',"@jay":'videos/video2.mp4',"@milo":'videos/video3.mp4'};const grid=document.getElementById('grid');if(defaults[username])grid.innerHTML='<div class="tile"><video src="'+defaults[username]+'" muted loop playsinline controls></video></div>';else grid.innerHTML='<div class="empty">No videos yet.</div>';
</script>
</body>
</html>

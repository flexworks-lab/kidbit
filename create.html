<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create • Kidbit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}.page{width:min(900px,92%);margin:auto;padding:35px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:45px}.logo{font-size:28px;font-weight:800}.logo span{color:#7c5cff}.back{border:1px solid #333;background:#151515;color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}.card{background:#101010;border:1px solid #292929;border-radius:20px;padding:28px}.title{font-size:28px;margin-bottom:8px}.sub{color:#888;margin-bottom:25px}.upload{height:270px;border:2px dashed #3a3a3a;border-radius:16px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#0b0b0b}.upload:hover{border-color:#7c5cff}.upload .plus{font-size:48px;color:#7c5cff}.upload p{color:#aaa;margin-top:8px}.preview{display:none;width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:14px;margin-bottom:22px}.fields{display:grid;gap:16px;margin-top:22px}label{font-size:13px;color:#aaa}textarea,input{width:100%;margin-top:7px;background:#171717;border:1px solid #333;border-radius:11px;color:#fff;padding:13px;font:inherit;outline:none}textarea{height:110px;resize:vertical}textarea:focus,input:focus{border-color:#7c5cff}.bottom{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.postBtn{border:0;background:#7c5cff;color:#fff;padding:13px 22px;border-radius:11px;font-weight:bold;cursor:pointer}.postBtn:disabled{opacity:.45;cursor:not-allowed}.status{color:#888;font-size:13px;align-self:center}
</style>
</head>
<body><div class="page"><header class="top"><div class="logo">kid<span>bit</span></div><button class="back" onclick="location.href='index.html'">← Back</button></header><section class="card"><h1 class="title">Create a video</h1><p class="sub">Share something cool with Kidbit.</p><input id="videoInput" type="file" accept="video/*" hidden><div class="upload" id="upload"><div><div class="plus">＋</div><strong>Choose a video</strong><p>MP4, WebM, MOV and other video files</p></div></div><video id="preview" class="preview" controls playsinline></video><div class="fields"><div><label>Caption</label><textarea id="caption" maxlength="180" placeholder="What is happening in your video?"></textarea></div><div><label>Tags</label><input id="tags" maxlength="120" placeholder="#gaming #art #kidbit"></div></div><div class="bottom"><span class="status" id="status"></span><button class="postBtn" id="postBtn" disabled>Post to Kidbit</button></div></section></div>
<script>
const input=document.getElementById('videoInput'),upload=document.getElementById('upload'),preview=document.getElementById('preview'),caption=document.getElementById('caption'),tags=document.getElementById('tags'),postBtn=document.getElementById('postBtn'),status=document.getElementById('status');let selectedFile=null,previewUrl=null;
upload.onclick=()=>input.click();input.onchange=()=>{selectedFile=input.files[0];if(!selectedFile)return;if(!selectedFile.type.startsWith('video/')){status.textContent='Please choose a video.';selectedFile=null;return}if(selectedFile.size>200*1024*1024){status.textContent='Keep videos under 200 MB.';selectedFile=null;return}previewUrl&&URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(selectedFile);preview.src=previewUrl;preview.style.display='block';upload.style.display='none';update();status.textContent=selectedFile.name};caption.oninput=tags.oninput=update;function update(){postBtn.disabled=!selectedFile||!caption.value.trim()}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('KidbitDB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('posts'))r.result.createObjectStore('posts',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
postBtn.onclick=async()=>{postBtn.disabled=true;status.textContent='Saving video…';try{const db=await openDB();const post={id:crypto.randomUUID(),videoBlob:selectedFile,username:'@you',avatar:'Y',description:caption.value.trim(),tags:tags.value.trim(),likes:0,comments:0,createdAt:Date.now()};await new Promise((resolve,reject)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(post);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});status.textContent='Posted!';setTimeout(()=>location.href='index.html',500)}catch(e){console.error(e);status.textContent='Could not save the video.';postBtn.disabled=false}};
</script></body></html>

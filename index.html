<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kidbit</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:#090909;border-right:1px solid #222;padding:25px 14px;z-index:20}.logo{font-size:28px;font-weight:800;padding:5px 14px 30px}.logo span{color:#7c5cff}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#aaa;padding:14px;border-radius:10px;text-align:left;cursor:pointer;font-size:15px}.nav button:hover,.nav button.active{background:#191919;color:#fff}.create{margin-top:18px;background:#7c5cff!important;color:#fff!important;text-align:center!important;font-weight:bold}.topbar{position:fixed;left:230px;right:0;top:0;height:65px;display:flex;justify-content:center;align-items:center;z-index:15;pointer-events:none}.tabs{pointer-events:auto;display:flex;gap:28px;padding:10px 20px;background:rgba(10,10,10,.75);backdrop-filter:blur(12px);border:1px solid #292929;border-radius:30px}.tabs button{border:0;background:transparent;color:#777;cursor:pointer}.tabs button.active{color:#fff;font-weight:bold}.search{position:fixed;right:25px;top:15px;width:180px;padding:9px 14px;border-radius:20px;background:#181818;border:1px solid #292929;color:#fff;outline:none;z-index:30}.feed{margin-left:230px;width:calc(100vw - 230px);height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.post{position:relative;width:100%;height:100vh;scroll-snap-align:start;display:flex;justify-content:center;align-items:center;background:#080808}.video{width:100%;height:100%;object-fit:contain;background:#000}.post:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.88))}.info{position:absolute;left:30px;bottom:35px;z-index:5;max-width:500px}.creator{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:bold}.creator-name{cursor:pointer}.creator-name:hover{text-decoration:underline}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#00d4ff);font-weight:bold}.follow{border:0;background:transparent;color:#9b86ff;font-weight:bold;cursor:pointer}.follow.following{color:#aaa}.description{font-size:15px;line-height:1.5}.tags{margin-top:7px;color:#ccc}.actions{position:absolute;right:28px;bottom:75px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:18px}.action{border:0;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}.icon{width:52px;height:52px;border-radius:50%;background:rgba(30,30,30,.8);border:1px solid #444;display:grid;place-items:center;font-size:21px;transition:.15s}.action:hover .icon{transform:scale(1.08);background:#292929}.like.active .icon{color:#ff477e}.sound{position:absolute;right:25px;top:85px;z-index:10;width:45px;height:45px;border-radius:50%;border:1px solid #444;background:rgba(20,20,20,.8);color:#fff;cursor:pointer;font-size:18px}.play{position:absolute;z-index:8;width:75px;height:75px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:30px;display:none;cursor:pointer}.empty{height:100vh;display:grid;place-items:center;color:#777;font-size:18px}.empty span{display:block;text-align:center}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#222;border:1px solid #444;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:800px){.sidebar{width:65px;padding:15px 7px}.logo{font-size:0;text-align:center}.logo span{font-size:24px}.nav button{font-size:0;text-align:center}.feed{margin-left:65px;width:calc(100vw - 65px)}.topbar{left:65px}.search{display:none}.info{left:18px;bottom:25px;max-width:65%}.actions{right:12px}}
</style></head><body>
<aside class="sidebar"><div class="logo">kid<span>bit</span></div><nav class="nav"><button class="active">🏠 Home</button><button>🔥 Trending</button><button>🔎 Discover</button><button>👥 Following</button><button>💾 Favorites</button><button onclick="location.href='profile.html?user=@alex'">👤 Profile</button><button class="create" onclick="location.href='create.html'">＋ Create</button></nav></aside>
<header class="topbar"><div class="tabs"><button class="active">For You</button><button>Following</button><button>New</button></div></header><input class="search" id="search" placeholder="Search Kidbit..."><main class="feed" id="feed"></main><div class="toast" id="toast"></div>
<script>
const defaultPosts=[{video:'videos/video1.mp4',username:'@alex',avatar:'A',description:'I finally finished my game! 🎮',tags:'#gamedev #coding #kidbit',likes:12400,comments:342},{video:'videos/video2.mp4',username:'@jay',avatar:'J',description:'This took me all weekend 😭',tags:'#animation #art #kidbit',likes:8100,comments:129},{video:'videos/video3.mp4',username:'@milo',avatar:'M',description:'What should I make next?',tags:'#gaming #creator #kidbit',likes:5700,comments:204}];let posts=[...defaultPosts];const liked=new Set(JSON.parse(localStorage.getItem('kidbitLiked')||'[]'));const saved=new Set(JSON.parse(localStorage.getItem('kidbitSaved')||'[]'));const followed=new Set(JSON.parse(localStorage.getItem('kidbitFollowed')||'[]'));
function formatNumber(n){if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return(n/1000).toFixed(1).replace('.0','')+'K';return String(n)}function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}function saveSet(key,set){localStorage.setItem(key,JSON.stringify([...set]))}function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function createPost(post,index){const section=document.createElement('section');section.className='post';section.dataset.index=index;section.innerHTML=`<video class="video" src="${post.video}" loop muted playsinline preload="metadata"></video><button class="play">▶</button><button class="sound">🔇</button><div class="info"><div class="creator"><div class="avatar">${post.avatar||'K'}</div><span class="creator-name">${escapeHtml(post.username||'@kidbit')}</span><button class="follow">${followed.has(post.username)?'Following':'Follow'}</button></div><div class="description">${escapeHtml(post.description||'')}</div><div class="tags">${escapeHtml(post.tags||'')}</div></div><div class="actions"><button class="action like"><div class="icon">♥</div><span>${formatNumber(post.likes||0)}</span></button><button class="action comment"><div class="icon">💬</div><span>${post.comments||0}</span></button><button class="action save"><div class="icon">🔖</div><span>${saved.has(post.id)?'Saved':'Save'}</span></button><button class="action share"><div class="icon">↗</div><span>Share</span></button></div>`;
const video=section.querySelector('.video'),play=section.querySelector('.play'),sound=section.querySelector('.sound'),like=section.querySelector('.like'),save=section.querySelector('.save'),follow=section.querySelector('.follow'),creatorName=section.querySelector('.creator-name');if(liked.has(post.id||post.video))like.classList.add('active');if(saved.has(post.id))save.classList.add('active');creatorName.onclick=()=>location.href='profile.html?user='+encodeURIComponent(post.username||'@kidbit');video.addEventListener('click',()=>{if(video.paused){video.play().catch(()=>{});play.style.display='none'}else{video.pause();play.style.display='grid'}});play.addEventListener('click',()=>{video.play().catch(()=>{});play.style.display='none'});sound.addEventListener('click',e=>{e.stopPropagation();video.muted=!video.muted;sound.textContent=video.muted?'🔇':'🔊'});like.addEventListener('click',()=>{const key=post.id||post.video;if(liked.has(key)){liked.delete(key);post.likes=Math.max(0,(post.likes||0)-1);like.classList.remove('active')}else{liked.add(key);post.likes=(post.likes||0)+1;like.classList.add('active')}like.querySelector('span').textContent=formatNumber(post.likes);saveSet('kidbitLiked',liked)});save.addEventListener('click',()=>{if(!post.id){showToast('This video cannot be saved yet');return}if(saved.has(post.id)){saved.delete(post.id);save.classList.remove('active');save.querySelector('span').textContent='Save'}else{saved.add(post.id);save.classList.add('active');save.querySelector('span').textContent='Saved'}saveSet('kidbitSaved',saved)});follow.addEventListener('click',()=>{if(followed.has(post.username)){followed.delete(post.username);follow.classList.remove('following');follow.textContent='Follow'}else{followed.add(post.username);follow.classList.add('following');follow.textContent='Following'}saveSet('kidbitFollowed',followed)});section.querySelector('.comment').addEventListener('click',()=>showToast('Comments are coming next! 💬'));section.querySelector('.share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);showToast('Link copied!')}catch{showToast('Share link ready!')}});return section}
async function loadUserPosts(){if(!('indexedDB'in window))return;return new Promise(resolve=>{const req=indexedDB.open('KidbitDB',1);req.onerror=()=>resolve();req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains('posts')){resolve();return}const all=db.transaction('posts','readonly').objectStore('posts').getAll();all.onsuccess=()=>{for(const p of all.result.reverse()){if(p.videoBlob){p.video=URL.createObjectURL(p.videoBlob);posts.unshift(p)}}resolve()};all.onerror=()=>resolve()}})}function render(filter=''){const feed=document.getElementById('feed');feed.innerHTML='';const q=filter.trim().toLowerCase();const visible=posts.filter(p=>!q||[p.username,p.description,p.tags].join(' ').toLowerCase().includes(q));if(!visible.length){feed.innerHTML='<div class="empty"><span>No videos found.<br>Try another search.</span></div>';return}visible.forEach((p,i)=>feed.appendChild(createPost(p,i)));setupObserver()}function setupObserver(){const videos=[...document.querySelectorAll('.video')];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target;if(entry.isIntersecting&&entry.intersectionRatio>.6){videos.forEach(other=>{if(other!==v)other.pause()});v.play().catch(()=>{})}else v.pause()}),{threshold:[.6]});videos.forEach(v=>observer.observe(v))}document.getElementById('search').addEventListener('input',e=>render(e.target.value));document.addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;const feed=document.getElementById('feed'),postsEls=[...feed.querySelectorAll('.post')],current=postsEls.findIndex(p=>p.getBoundingClientRect().top>=-10);let target;e.key==='ArrowDown'?target=Math.min(postsEls.length-1,Math.max(0,current+1)):target=Math.max(0,current-1);postsEls[target]?.scrollIntoView({behavior:'smooth'})});loadUserPosts().then(()=>render());
</script></body></html>

```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kidbit</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 230px;
    height: 100vh;

    background: #090909;

    border-right: 1px solid #222;

    padding: 25px 14px;

    z-index: 20;
}

.logo {

    font-size: 28px;

    font-weight: 800;

    padding: 5px 14px 30px;

}

.logo span {
    color: #7c5cff;
}

.nav {

    display: flex;

    flex-direction: column;

    gap: 6px;

}

.nav button {

    border: none;

    background: transparent;

    color: #aaa;

    padding: 14px;

    border-radius: 10px;

    text-align: left;

    cursor: pointer;

    font-size: 15px;

}

.nav button:hover,
.nav button.active {

    background: #191919;

    color: white;

}

.create {

    margin-top: 18px;

    background: #7c5cff !important;

    color: white !important;

    text-align: center !important;

    font-weight: bold;

}

/* =========================
   TOP BAR
========================= */

.topbar {

    position: fixed;

    left: 230px;
    right: 0;
    top: 0;

    height: 65px;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 15;

    pointer-events: none;

}

.tabs {

    pointer-events: auto;

    display: flex;

    gap: 28px;

    padding: 10px 20px;

    background: rgba(10,10,10,.75);

    backdrop-filter: blur(12px);

    border: 1px solid #292929;

    border-radius: 30px;

}

.tabs button {

    border: none;

    background: transparent;

    color: #777;

    cursor: pointer;

}

.tabs button.active {

    color: white;

    font-weight: bold;

}

/* =========================
   SEARCH
========================= */

.search {

    position: fixed;

    right: 25px;
    top: 15px;

    width: 180px;

    padding: 9px 14px;

    border-radius: 20px;

    background: #181818;

    border: 1px solid #292929;

    color: white;

    outline: none;

    z-index: 30;

}

/* =========================
   FEED
========================= */

.feed {

    margin-left: 230px;

    width: calc(100vw - 230px);

    height: 100vh;

    overflow-y: scroll;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

}

.feed::-webkit-scrollbar {
    display: none;
}

/* =========================
   VIDEO
========================= */

.post {

    position: relative;

    width: 100%;

    height: 100vh;

    scroll-snap-align: start;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #080808;

}

.video {

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: #000;

}

/* =========================
   GRADIENT
========================= */

.post::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 40%;

    pointer-events: none;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );

}

/* =========================
   VIDEO INFO
========================= */

.info {

    position: absolute;

    left: 30px;

    bottom: 35px;

    z-index: 5;

    max-width: 500px;

}

.creator {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;

    font-weight: bold;

}

.avatar {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: grid;

    place-items: center;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #00d4ff
        );

    font-weight: bold;

}

.follow {

    border: none;

    background: transparent;

    color: #7c5cff;

    font-weight: bold;

    cursor: pointer;

}

.description {

    font-size: 15px;

    line-height: 1.5;

}

.tags {

    margin-top: 7px;

    color: #ccc;

}

/* =========================
   ACTIONS
========================= */

.actions {

    position: absolute;

    right: 28px;

    bottom: 75px;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 18px;

}

.action {

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 5px;

}

.icon {

    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: rgba(30,30,30,.8);

    border: 1px solid #444;

    display: grid;

    place-items: center;

    font-size: 21px;

    transition: .15s;

}

.action:hover .icon {

    transform: scale(1.08);

    background: #292929;

}

.like.active .icon {

    color: #ff477e;

}

/* =========================
   SOUND
========================= */

.sound {

    position: absolute;

    right: 25px;
    top: 85px;

    z-index: 10;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid #444;

    background: rgba(20,20,20,.8);

    color: white;

    cursor: pointer;

    font-size: 18px;

}

/* =========================
   PLAY
========================= */

.play {

    position: absolute;

    z-index: 8;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    border: none;

    background: rgba(0,0,0,.55);

    color: white;

    font-size: 30px;

    display: none;

    cursor: pointer;

}

/* =========================
   MOBILE
========================= */

@media(max-width:800px) {

    .sidebar {

        width: 65px;

        padding: 15px 7px;

    }

    .logo {

        font-size: 0;

        text-align: center;

    }

    .logo span {

        font-size: 24px;

    }

    .nav button {

        font-size: 0;

        text-align: center;

    }

    .feed {

        margin-left: 65px;

        width: calc(100vw - 65px);

    }

    .topbar {

        left: 65px;

    }

    .search {

        display: none;

    }

    .info {

        left: 18px;

        bottom: 25px;

        max-width: 65%;

    }

    .actions {

        right: 12px;

    }

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        kid<span>bit</span>
    </div>

    <nav class="nav">

        <button class="active">
            🏠 Home
        </button>

        <button>
            🔥 Trending
        </button>

        <button>
            🔎 Discover
        </button>

        <button>
            👥 Following
        </button>

        <button>
            💾 Favorites
        </button>

        <button class="create">
            ＋ Create
        </button>

    </nav>

</aside>


<!-- TOP -->

<header class="topbar">

    <div class="tabs">

        <button class="active">
            For You
        </button>

        <button>
            Following
        </button>

        <button>
            New
        </button>

    </div>

</header>


<input
    class="search"
    placeholder="Search Kidbit..."
>


<!-- FEED -->

<main
    class="feed"
    id="feed"
></main>


<script>

/* =========================
   VIDEO POSTS

   Put your videos in:

   Kidbit/
   └── videos/
       ├── video1.mp4
       ├── video2.mp4
       └── video3.mp4
========================= */

const posts = [

    {
        video: "videos/video1.mp4",

        username: "@alex",

        avatar: "A",

        description:
            "I finally finished my game! 🎮",

        tags:
            "#gamedev #coding #kidbit",

        likes: "12.4K",

        comments: "342"
    },

    {
        video: "videos/video2.mp4",

        username: "@jay",

        avatar: "J",

        description:
            "This took me all weekend 😭",

        tags:
            "#animation #art #kidbit",

        likes: "8.1K",

        comments: "129"
    },

    {
        video: "videos/video3.mp4",

        username: "@milo",

        avatar: "M",

        description:
            "What should I make next?",

        tags:
            "#gaming #creator #kidbit",

        likes: "5.7K",

        comments: "204"
    }

];


/* =========================
   CREATE POST
========================= */

function createPost(post) {

    const section =
        document.createElement("section");

    section.className = "post";


    section.innerHTML = `

        <video
            class="video"
            src="${post.video}"
            loop
            muted
            playsinline
            preload="metadata"
        ></video>


        <button class="play">
            ▶
        </button>


        <button class="sound">
            🔇
        </button>


        <div class="info">

            <div class="creator">

                <div class="avatar">
                    ${post.avatar}
                </div>

                ${post.username}

                <button class="follow">
                    Follow
                </button>

            </div>


            <div class="description">
                ${post.description}
            </div>


            <div class="tags">
                ${post.tags}
            </div>

        </div>


        <div class="actions">

            <button class="action like">

                <div class="icon">
                    ♥
                </div>

                <span>
                    ${post.likes}
                </span>

            </button>


            <button class="action comment">

                <div class="icon">
                    💬
                </div>

                <span>
                    ${post.comments}
                </span>

            </button>


            <button class="action">

                <div class="icon">
                    🔖
                </div>

                <span>
                    Save
                </span>

            </button>


            <button class="action">

                <div class="icon">
                    ↗
                </div>

                <span>
                    Share
                </span>

            </button>

        </div>

    `;


    const video =
        section.querySelector(".video");

    const sound =
        section.querySelector(".sound");

    const play =
        section.querySelector(".play");


    /* PLAY / PAUSE */

    video.addEventListener(
        "click",
        () => {

            if (video.paused) {

                video.play();

            } else {

                video.pause();

            }

        }
    );


    video.addEventListener(
        "pause",
        () => {

            play.style.display =
                "grid";

        }
    );


    video.addEventListener(
        "play",
        () => {

            play.style.display =
                "none";

        }
    );


    play.addEventListener(
        "click",
        () => {

            video.play();

        }
    );


    /* SOUND */

    sound.addEventListener(
        "click",
        () => {

            video.muted =
                !video.muted;

            sound.textContent =
                video.muted
                    ? "🔇"
                    : "🔊";

        }
    );


    /* LIKE */

    const like =
        section.querySelector(".like");

    like.addEventListener(
        "click",
        () => {

            like.classList.toggle("active");

        }
    );


    return section;

}


/* =========================
   LOAD POSTS
========================= */

const feed =
    document.getElementById("feed");


posts.forEach(post => {

    feed.appendChild(
        createPost(post)
    );

});


/* =========================
   AUTO PLAY
========================= */

const observer =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                const video =
                    entry.target.querySelector(".video");

                if (entry.isIntersecting) {

                    video.play().catch(() => {});

                } else {

                    video.pause();

                }

            });

        },
        {
            threshold: 0.7
        }
    );


document
    .querySelectorAll(".post")
    .forEach(post => {

        observer.observe(post);

    });


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "ArrowDown") {

            feed.scrollBy({

                top:
                    window.innerHeight,

                behavior:
                    "smooth"

            });

        }


        if (event.key === "ArrowUp") {

            feed.scrollBy({

                top:
                    -window.innerHeight,

                behavior:
                    "smooth"

            });

        }

    }
);

</script>

</body>

</html>
```
